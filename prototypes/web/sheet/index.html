<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folio Sheet</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .fx { display: flex; gap: 8px; padding: 4px 10px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; }
    #ref { width: 64px; text-align: center; font-weight: 600; }
    #formula { flex: 1; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
    #ref { font: inherit; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
    .grid-wrap { flex: 1; overflow: auto; background: var(--panel); }
    table { border-collapse: collapse; table-layout: fixed; font-size: 14px; }
    th, td { border: 1px solid var(--line); height: 26px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th { background: var(--hover); color: var(--muted); font-weight: 600; position: sticky; top: 0; z-index: 1; }
    th.rh { left: 0; position: sticky; z-index: 2; width: 44px; min-width: 44px; }
    td { min-width: 96px; width: 96px; max-width: 96px; cursor: cell; }
    td.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
    td.num { text-align: right; } td.err { color: #dc2626; } td.b { font-weight: 700; }
    td input { width: 100%; height: 100%; border: 0; outline: 0; font: inherit; background: transparent; color: var(--ink); padding: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="home" href="/index.html" title="Folio Hub">Hub</a><span class="title">Folio Sheet</span>
    <button data-cmd="file.new">New</button>
    <button data-cmd="file.open">Open CSV</button>
    <button data-cmd="file.save.csv">Save CSV</button><span class="sep"></span>
    <button data-cmd="fmt.bold"><b>B</b></button>
    <button data-cmd="edit.clear">Clear cell</button>
    <button data-cmd="sort.asc">Sort A→Z</button>
    <button data-cmd="sort.desc">Sort Z→A</button>
  </div>
  <div class="fx"><input id="ref" value="A1" aria-label="Cell address" readonly><span>fx</span><input id="formula" aria-label="Formula bar" autocomplete="off"></div>
  <div class="grid-wrap"><table id="grid"></table></div>
  <div class="status"><span id="sum">—</span><span id="saved">Saved in this browser</span><span>Arrows move · Enter/F2 edits · Ctrl+K commands</span></div>
  <script type="module" src="sheet.js"></script>
</body>
</html>
