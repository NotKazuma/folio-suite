name: release
# Runs only when a version tag (v1.2.3) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p wren-launcher
      - name: Package
        shell: pwsh
        run: |
          # <id>-<version>-windows-x64.exe, same shape as every Wren app.
          $v = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/wren-launcher.exe" "dist/wren-launcher-$v-windows-x64.exe"
          Push-Location dist
          Get-ChildItem *.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content SHA256SUMS.txt
          Pop-Location
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
