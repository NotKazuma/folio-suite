name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Publish (small, needs the .NET 8 Desktop Runtime)
        run: dotnet publish desktop/Folio.csproj -c Release -r win-x64 --self-contained false -o out/small
      - name: Publish (standalone, bundles .NET)
        run: dotnet publish desktop/Folio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/standalone
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive out/small/* "folio-$v-windows-x64.zip"
          Compress-Archive out/standalone/* "folio-$v-windows-x64-standalone.zip"
          (Get-FileHash folio-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }) | Set-Content SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" folio-*.zip SHA256SUMS.txt --generate-notes
