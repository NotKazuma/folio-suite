name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p folio-launcher -p folio-write -p folio-sheet -p folio-slide
      - name: Package
        shell: pwsh
        run: |
          # Files are named <app id>-<version>-windows-x64.exe: the launcher finds each app by that prefix.
          $v = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($app in 'folio-launcher','folio-write','folio-sheet','folio-slide') {
            Copy-Item "target/release/$app.exe" "dist/$app-$v-windows-x64.exe"
          }
          Push-Location dist
          Get-ChildItem *.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content SHA256SUMS.txt
          Pop-Location
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
