[workspace]
resolver = "3"
members = ["crates/core", "crates/native", "crates/ui-egui", "crates/write-doc", "crates/docx", "crates/sheet-engine", "apps/folio-launcher", "apps/folio-write", "apps/folio-sheet", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NotKazuma/folio-suite"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
